<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Sem Giro</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#fffdfa; --ink:#221f1b; --soft:#6f6960;
    --line:#e4ddd2; --rust:#b0532c; --rust-ink:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131210; --card:#1d1b18; --ink:#f2efe9; --soft:#a7a097;
      --line:#33302b; --rust:#c9663a; --rust-ink:#fff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131210; --card:#1d1b18; --ink:#f2efe9; --soft:#a7a097;
    --line:#33302b; --rust:#c9663a; --rust-ink:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);display:flex;
    align-items:center;justify-content:center;padding:24px 16px;
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .cartao{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:30px 28px 26px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);}
  h1{font-size:19px;margin:0 0 5px;letter-spacing:-.015em;}
  p.sub{margin:0 0 22px;color:var(--soft);font-size:13px;}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;}
  input[type=password],input[type=text]{width:100%;font:15px/1.4 inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none;margin-bottom:14px;}
  input[type=password]:focus,input[type=text]:focus{border-color:var(--rust);}
  .lembrar{display:flex;align-items:center;gap:8px;margin:2px 0 18px;font-size:12.5px;color:var(--soft);}
  .lembrar input{accent-color:var(--rust);width:15px;height:15px;margin:0;}
  button{width:100%;font:600 14.5px/1 inherit;color:var(--rust-ink);background:var(--rust);
    border:none;border-radius:8px;padding:13px;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .erro{margin:14px 0 0;font-size:13px;color:#b3341d;min-height:18px;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .erro{color:#f09077;}}
</style>
</head>
<body>
  <form class="cartao" id="f">
    <h1>Painel Sem Giro</h1>
    <p class="sub">GTN Shop &middot; conteúdo protegido</p>
    <label for="u">Usuário</label>
    <input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
    <label for="s">Senha</label>
    <input type="password" id="s" autocomplete="current-password">
    <div class="lembrar">
      <input type="checkbox" id="lembrar" checked>
      <label for="lembrar" style="margin:0;font-weight:400;">Lembrar neste navegador</label>
    </div>
    <button type="submit" id="b">Entrar</button>
    <p class="erro" id="e"></p>
  </form>

const CHAVE_LS = "painel-giro-login";
try { localStorage.removeItem("painel-giro-senha"); } catch (e) {}

const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function derivar(senha, sal) {
  const material = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: sal, iterations: ITER, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function abrir(login, senha) {
  const u = USERS.find(x => x.id === String(login).trim().toLowerCase());
  if (!u) throw new Error("usuario");
  // senha errada -> o AES-GCM rejeita, porque a etiqueta de autenticidade não bate
  const kw = await derivar(senha, bytes(u.sal));
  const bruta = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(u.iv) }, kw, bytes(u.wk));
  const chave = await crypto.subtle.importKey("raw", bruta, "AES-GCM", false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, chave, bytes(DADOS));
  const fluxo = new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"));
  return { html: await new Response(fluxo).text(), user: { id: u.id, nome: u.nome, master: !!u.master } };
}

function mostrar(html, user) {
  const lista = USERS.map(x => ({ id: x.id, nome: x.nome, master: !!x.master }));
  const tag = "<script>window.PG_USER=" + JSON.stringify(user).replace(/</g, "\\u003c") + ";window.PG_USERS=" + JSON.stringify(lista).replace(/</g, "\\u003c") + ";<\/script>";
  const i = html.search(/<head[^>]*>/i);
  if (i >= 0) { const m = html.slice(i).match(/<head[^>]*>/i)[0]; html = html.slice(0, i + m.length) + tag + html.slice(i + m.length); }
  else html = tag + html;
  document.open(); document.write(html); document.close();
}

const f = document.getElementById("f"), cu = document.getElementById("u"), campo = document.getElementById("s"),
      btn = document.getElementById("b"), err = document.getElementById("e"),
      lembrar = document.getElementById("lembrar");

async function tentar(login, senha, guardar) {
  btn.disabled = true; btn.textContent = "Abrindo…"; err.textContent = "";
  try {
    const r = await abrir(login, senha);
    if (guardar) { try { localStorage.setItem(CHAVE_LS, JSON.stringify({ u: login, p: senha })); } catch (e) {} }
    mostrar(r.html, r.user);
    return true;
  } catch (e) {
    try { localStorage.removeItem(CHAVE_LS); } catch (e2) {}
    btn.disabled = false; btn.textContent = "Entrar";
    err.textContent = "Usuário ou senha incorretos.";
    campo.select();
    return false;
  }
}

f.addEventListener("submit", ev => {
  ev.preventDefault();
  if (!cu.value.trim() || !campo.value) { err.textContent = "Digite o usuário e a senha."; return; }
  tentar(cu.value, campo.value, lembrar.checked);
});

// já entrou antes neste navegador: abre direto
(function () {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(CHAVE_LS) || "null"); } catch (e) {}
  if (g && g.u && g.p) { cu.value = g.u; campo.value = g.p; tentar(g.u, g.p, true); return; }
  let lu = null;
  try { lu = localStorage.getItem("painel-giro-lock-user"); localStorage.removeItem("painel-giro-lock-user"); } catch (e) {}
  if (lu) { cu.value = lu; document.querySelector("p.sub").textContent = "🔒 Painel bloqueado · digite a senha"; campo.focus(); }
})();
